services:
  mysql:
    image: mysql:8.0
    container_name: hamu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AIChat}
      # 允许应用容器从其它主机以 root 连接
      MYSQL_ROOT_HOST: "%"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时按文件名顺序初始化库表（仅在数据卷为空时执行）
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/migrations/001_context_memories.sql:/docker-entrypoint-initdb.d/02-001_context_memories.sql:ro
      - ./backend/db/migrations/002_mcp_tool_safety.sql:/docker-entrypoint-initdb.d/03-002_mcp_tool_safety.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 默认不对外暴露数据库端口；本地调试可取消注释
    # ports:
    #   - "127.0.0.1:3306:3306"
    networks:
      - hamu

  backend:
    build: ./backend
    container_name: hamu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AIChat}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?请先在 .env 中设置 DATA_ENCRYPTION_KEY}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      CONTEXT_ADMIN_USERNAMES: ${CONTEXT_ADMIN_USERNAMES:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 对话 Markdown 导出目录，持久化
      - pet_conversations:/app/conversations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hamu

  frontend:
    build: ./frontend
    container_name: hamu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - hamu

volumes:
  mysql_data:
  pet_conversations:

networks:
  hamu:
    driver: bridge
