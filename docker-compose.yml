services:
  mysql:
    image: mysql:8.0
    container_name: hamu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AIChat}
      # 允许应用容器从其它主机以 root 连接
      MYSQL_ROOT_HOST: "%"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时按文件名顺序初始化库表（仅在数据卷为空时执行）
      # 方案 A：服务器无代码，SQL 文件集中放在 /opt/hamu-pet/sql/ 下
      - /opt/hamu-pet/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - /opt/hamu-pet/sql/001_context_memories.sql:/docker-entrypoint-initdb.d/02-001_context_memories.sql:ro
      - /opt/hamu-pet/sql/002_mcp_tool_safety.sql:/docker-entrypoint-initdb.d/03-002_mcp_tool_safety.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # backend 使用 host 网络后需通过宿主机端口访问 mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - hamu

  backend:
    image: hamumudocker/hamu-pet-backend:latest
    container_name: hamu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # 不映射 8000 到宿主机，frontend 通过容器内网访问 backend:8000
    # 本地调试如需直连 backend，可临时取消注释（注意 Windows 可能保留 8000）
    # ports:
    #   - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AIChat}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?请先在 .env 中设置 DATA_ENCRYPTION_KEY}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      CONTEXT_ADMIN_USERNAMES: ${CONTEXT_ADMIN_USERNAMES:-}
      TZ: ${TZ:-Asia/Shanghai}
      # MCP 子进程下载依赖走国内镜像，解决 bridge 网络下 pypi.org TLS 超时
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple/
      PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    volumes:
      # 对话 Markdown 导出目录，持久化
      - pet_conversations:/app/conversations
      # MCP 文件系统共享目录：服务器 /opt/hamu-pet/shared ↔ 容器 /app/shared
      # 把需要 AI 访问的文件放到 /opt/hamu-pet/shared 目录，MCP 配置路径填 /app/shared
      - /opt/hamu-pet/shared:/app/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hamu

  frontend:
    image: hamumudocker/hamu-pet-frontend:latest
    container_name: hamu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # HTTPS 证书目录：服务器 /opt/hamu-pet/certs/{fullchain.pem,privkey.pem}
      - /opt/hamu-pet/certs:/etc/nginx/certs:ro
    networks:
      - hamu

volumes:
  mysql_data:
  pet_conversations:

networks:
  hamu:
    driver: bridge
